[project]
name = "task-management-api"
version = "1.0.0"
description = "Practice exercise for learning Quart + React patterns"
requires-python = ">=3.11"

dependencies = [
    "quart>=0.20.0",
    "quart-cors>=0.7.0",
    "hypercorn>=0.17.3",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "mypy>=1.7.0",
]

[tool.pytest.ini_options]
# Alternative to pytest.ini (same configuration)
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "-vv", "--strict-markers", "--tb=short"]
asyncio_mode = "strict"
markers = [
    "unit: Unit tests for backend logic",
    "e2e: End-to-end tests with Playwright",
    "slow: Tests that take a long time",
]

[tool.coverage.run]
source = ["app/backend"]
omit = ["*/tests/*", "*/conftest.py", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
# Linter configuration
line-length = 100
target-version = "py311"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py

[tool.black]
# Code formatter configuration
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
# Type checker configuration
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
