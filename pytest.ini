[pytest]
# pytest configuration for the practice exercise
# Reference: https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref

# Minimum Python version required
minversion = 7.0

# Paths to search for tests
testpaths = tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Default command line options
addopts =
    # Show test summary for all outcomes
    -ra
    # Very verbose output
    -vv
    # Show local variables in tracebacks
    -l
    # Strict marker mode (error on unknown markers)
    --strict-markers
    # Shorter traceback format
    --tb=short
    # Disable pytest warnings summary
    -p no:warnings

# Async test configuration
asyncio_mode = strict

# Custom markers for organizing tests
markers =
    unit: Unit tests for backend logic
    e2e: End-to-end tests with Playwright
    slow: Tests that take a long time (> 1 second)
    integration: Integration tests between components
    smoke: Quick smoke tests for critical functionality

# Console output format
console_output_style = progress

# Log configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration (when using pytest-cov)
[coverage:run]
source = app/backend
omit =
    */tests/*
    */conftest.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
